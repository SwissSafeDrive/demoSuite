<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#1a1a1a"/>
  <!-- Sky / overcast -->
  <rect x="0" y="0" width="640" height="130" fill="#2a2a2a"/>
  <!-- Intersection / piazza -->
  <rect x="0" y="200" width="640" height="160" fill="#2e2e2e"/>
  <!-- Crosswalk stripes -->
  <rect x="160" y="205" width="24" height="100" fill="#555" opacity="0.7"/>
  <rect x="196" y="205" width="24" height="100" fill="#555" opacity="0.7"/>
  <rect x="232" y="205" width="24" height="100" fill="#555" opacity="0.7"/>
  <!-- Buildings background -->
  <rect x="0" y="50" width="180" height="150" fill="#222"/>
  <rect x="460" y="30" width="180" height="170" fill="#222"/>
  <rect x="200" y="80" width="240" height="120" fill="#2a2a2a"/>
  <!-- Windows -->
  <rect x="20" y="65" width="20" height="15" fill="#ffd060" opacity="0.7"/>
  <rect x="50" y="65" width="20" height="15" fill="#ffd060" opacity="0.4"/>
  <rect x="80" y="65" width="20" height="15" fill="#ffd060" opacity="0.9"/>
  <rect x="140" y="65" width="20" height="15" fill="#ffd060" opacity="0.5"/>
  <rect x="470" y="45" width="20" height="15" fill="#ffd060" opacity="0.8"/>
