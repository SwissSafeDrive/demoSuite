<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#1a1a1a"/>
  <!-- Tunnel / underpass scene -->
  <rect x="0" y="0" width="640" height="360" fill="#111"/>
  <!-- Tunnel arch -->
  <ellipse cx="320" cy="0" rx="280" ry="220" fill="#1e1e1e"/>
  <ellipse cx="320" cy="0" rx="260" ry="200" fill="#111"/>
  <!-- Road -->
  <polygon points="80,360 560,360 460,180 180,180" fill="#252525"/>
  <!-- Lane dividers -->
  <polygon points="316,185" fill="none"/>
  <rect x="312" y="190" width="16" height="25" fill="#666" opacity="0.5"/>
  <rect x="312" y="225" width="16" height="25" fill="#666" opacity="0.5"/>
  <rect x="312" y="260" width="16" height="25" fill="#666" opacity="0.5"/>
  <rect x="312" y="295" width="16" height="25" fill="#666" opacity="0.5"/>
  <rect x="312" y="330" width="16" height="25" fill="#666" opacity="0.5"/>
  <!-- Tunnel lights -->
  <circle cx="160" cy="100" r="12" fill="#ffe0a0" opacity="0.6"/>
  <circle cx="320" cy="60" r="15" fill="#ffe0a0" opacity="0.7"/>
  <circle cx="480" cy="100" r="12" fill="#ffe0a0" opacity="0.6"/>
  <!-- Vehicle -->
  <rect x="260" y="265" width="95" height="42" rx="4" fill="#3a3a4a"/>
  <rect x="268" y="257" width="79" height="24" rx="3" fill="#2c2c3c"/>
  <circle cx="278" cy="310" r="9" fill="#181818"/>
  <circle cx="338" cy="310" r="9" fill="#181818"/>
  <rect x="268" y="270" width="18" height="14" fill="#fff8a0" opacity="0.9"/>
  <rect x="330" y="270" width="18" height="14" fill="#ff4020" opacity="0.9"/>
  <!-- Timestamp overlay -->
  <rect x="0" y="0" width="640" height="22" fill="#000" opacity="0.5"/>
  <text x="8" y="15" font-family="monospace" font-size="12" fill="#0f0" opacity="0.9">CAM-03 | CORSO ELVEZIA 12, LUGANO | 2024-11-15 13:56:18</text>
  <!-- Corner markers -->
  <line x1="0" y1="0" x2="20" y2="0" stroke="#0f0" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="0" x2="0" y2="20" stroke="#0f0" stroke-width="2" opacity="0.5"/>
  <line x1="640" y1="0" x2="620" y2="0" stroke="#0f0" stroke-width="2" opacity="0.5"/>
  <line x1="640" y1="0" x2="640" y2="20" stroke="#0f0" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="360" x2="20" y2="360" stroke="#0f0" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="360" x2="0" y2="340" stroke="#0f0" stroke-width="2" opacity="0.5"/>
  <line x1="640" y1="360" x2="620" y2="360" stroke="#0f0" stroke-width="2" opacity="0.5"/>
  <line x1="640" y1="360" x2="640" y2="340" stroke="#0f0" stroke-width="2" opacity="0.5"/>
  <!-- Detection box -->
  <rect x="258" y="253" width="99" height="61" fill="none" stroke="#f00" stroke-width="2" stroke-dasharray="4,2" opacity="0.8"/>
